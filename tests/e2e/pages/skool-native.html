<!doctype html>
<html><head><meta charset="utf-8"><title>Mock Skool lesson (native player)</title>
<style>body{margin:0;font-family:sans-serif} .player{width:960px;height:540px;background:#000;position:relative} video{width:100%;height:100%}</style></head>
<body>
  <!-- Mock of a Skool Classroom lesson page. NOT real Skool markup. -->
  <h1 id="lesson-title">Lesson 1</h1>
  <div class="player" id="player">
    <video id="v" muted playsinline crossorigin="anonymous" src="/media/lesson.wav">
      <track kind="captions" srclang="en" label="English" src="/media/lesson.vtt">
    </video>
  </div>
  <script>
    // Simulate Skool's SPA navigation to the next lesson: replace the player and push history.
    window.goNextLesson = () => {
      history.pushState({}, '', location.pathname + '?md=lesson2');
      document.getElementById('lesson-title').textContent = 'Lesson 2';
      const p = document.getElementById('player');
      p.innerHTML = '<video id="v" muted playsinline crossorigin="anonymous" src="/media/lesson2.wav"><track kind="captions" srclang="en" label="English" src="/media/lesson2.vtt"></video>';
    };
  </script>
</body></html>
