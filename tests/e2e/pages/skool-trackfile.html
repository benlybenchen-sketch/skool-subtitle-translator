<!doctype html>
<html><head><meta charset="utf-8"><title>Mock Skool lesson — CC off, caption file referenced by &lt;track&gt;</title></head>
<body style="margin:0">
  <!-- English captions exist as a <track src> but CC is OFF (no "default"): the browser loads no
       cues for a disabled track. NOT real Skool markup. -->
  <div id="player" style="width:960px;height:540px;background:#000">
    <video id="v" muted playsinline style="width:100%;height:100%" src="/media/long.wav">
      <track kind="captions" srclang="en" label="English CC" src="/media/long.vtt">
    </video>
  </div>
</body></html>
