name: Build extension

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test
        run: node tests/run-tests.js
      - name: Package
        run: cd extension && zip -r ../skool-member-posts-exporter.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: skool-member-posts-exporter
          path: skool-member-posts-exporter.zip
      - name: Release (khi đẩy tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: skool-member-posts-exporter.zip
