name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - name: E2E (Chromium + built extension, mock pages)
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          node tests/e2e/run-e2e.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: release/*.zip
